<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Millennium dual-tip magnetic passive stylus set">
  <defs>
    <!-- A cylinder has no flat faces, so it cannot be shaded with a single
         linear fill. These gradients run across the *width* of the barrel and
         carry a narrow specular band at 30% — that band is what the eye reads
         as "round metal tube" instead of "dark rectangle". -->
    <linearGradient id="penBarrelA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="0.16" stop-color="#2b323a"/>
      <stop offset="0.30" stop-color="#7c8792"/>
      <stop offset="0.40" stop-color="#495159"/>
      <stop offset="0.68" stop-color="#1d232a"/>
      <stop offset="0.88" stop-color="#0a0d11"/>
      <stop offset="1" stop-color="#1a2027"/>
    </linearGradient>
    <linearGradient id="penBarrelB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a20"/>
      <stop offset="0.18" stop-color="#3a424b"/>
      <stop offset="0.32" stop-color="#9aa5b1"/>
      <stop offset="0.44" stop-color="#525b65"/>
      <stop offset="0.72" stop-color="#242a32"/>
      <stop offset="0.9" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#1d232a"/>
    </linearGradient>
    <linearGradient id="penSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d565f"/>
      <stop offset="0.24" stop-color="#c9d3dd"/>
      <stop offset="0.42" stop-color="#8b959f"/>
      <stop offset="0.7" stop-color="#3a4149"/>
      <stop offset="1" stop-color="#151a1f"/>
    </linearGradient>
    <linearGradient id="penTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3037"/>
      <stop offset="0.3" stop-color="#8e99a4"/>
      <stop offset="0.6" stop-color="#3b424a"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>

    <filter id="penSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="penSoftS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <!-- One pen, drawn horizontally around the origin and rotated at use time.
         Length 186 including both tips, barrel 15 tall. -->
    <g id="penShape">
      <!-- cast shadow on the desk, offset down-right -->
      <rect x="-64" y="7.5" width="128" height="4.5" rx="2.2" fill="#04070c" opacity="0.7" filter="url(#penSoft)"/>
      <rect x="58" y="6" width="22" height="3" rx="1.5" fill="#04070c" opacity="0.4" filter="url(#penSoft)"/>

      <!-- barrel -->
      <rect x="-64" y="-7.5" width="128" height="15" rx="7.5" fill="url(#penBarrelA)"/>

      <!-- tail cap seam + clip -->
      <rect x="-64" y="-7.5" width="16" height="15" rx="7.5" fill="url(#penBarrelB)"/>
      <rect x="-50.5" y="-7.5" width="1" height="15" fill="#000000" opacity="0.55"/>
      <rect x="-49.5" y="-7.5" width="0.7" height="15" fill="#ffffff" opacity="0.12"/>
      <rect x="-46" y="-9.2" width="30" height="2.6" rx="1.3" fill="url(#penSteel)"/>
      <rect x="-46" y="-9.2" width="30" height="0.7" rx="0.35" fill="#ffffff" opacity="0.35"/>

      <!-- side button -->
      <rect x="-6" y="-8.4" width="14" height="2.6" rx="1.3" fill="#0a0d11"/>
      <rect x="-6" y="-8.4" width="14" height="0.8" rx="0.4" fill="#6d7883" opacity="0.55"/>

      <!-- nose cone: steel collar then the tapered tip -->
      <rect x="62" y="-7.5" width="5" height="15" rx="1" fill="url(#penSteel)"/>
      <path d="M67 -7.5 L86 -1.6 L86 1.6 L67 7.5 Z" fill="url(#penTip)"/>
      <path d="M67 -7.5 L86 -1.6 L86 -0.4 L67 -5.6 Z" fill="#ffffff" opacity="0.30"/>
      <rect x="86" y="-1.7" width="6" height="3.4" rx="1.7" fill="#0a0d11"/>
      <circle cx="90.6" cy="0" r="1.15" fill="#33404c"/>

      <!-- barrel specular streak along the top third -->
      <rect x="-58" y="-5.8" width="116" height="1.7" rx="0.85" fill="#ffffff" opacity="0.24" filter="url(#penSoftS)"/>
      <rect x="-58" y="4.4" width="116" height="1" rx="0.5" fill="#ffffff" opacity="0.10" filter="url(#penSoftS)"/>
    </g>
  </defs>

  <!-- Rear pen: pushed back and dimmed, which is how depth reads in a photo
       of two objects lying parallel on a surface. -->
  <g transform="translate(160 90) rotate(-27) scale(1.16)" opacity="0.86">
    <use href="#penShape"/>
  </g>

  <!-- Front pen -->
  <g transform="translate(160 118) rotate(-27) scale(1.16)">
    <use href="#penShape"/>
  </g>
</svg>
