<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Millennium OPS i7 12700 module with 16GB RAM and 512GB SSD">
  <defs>
    <linearGradient id="opsTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b7c0ca"/>
      <stop offset="0.35" stop-color="#8d97a2"/>
      <stop offset="0.7" stop-color="#6b757f"/>
      <stop offset="1" stop-color="#4b545d"/>
    </linearGradient>
    <linearGradient id="opsFront" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#6f7983"/>
      <stop offset="0.16" stop-color="#4d565f"/>
      <stop offset="0.62" stop-color="#333b43"/>
      <stop offset="0.92" stop-color="#20262c"/>
      <stop offset="1" stop-color="#39414a"/>
    </linearGradient>
    <linearGradient id="opsSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3238"/>
      <stop offset="1" stop-color="#10151a"/>
    </linearGradient>
    <linearGradient id="opsPort" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d11"/>
      <stop offset="0.6" stop-color="#141a20"/>
      <stop offset="1" stop-color="#262e36"/>
    </linearGradient>
    <linearGradient id="opsBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4f8a"/>
      <stop offset="1" stop-color="#0b2038"/>
    </linearGradient>

    <pattern id="opsBrush" width="2.2" height="2.2" patternUnits="userSpaceOnUse">
      <rect width="2.2" height="2.2" fill="none"/>
      <path d="M0 0.6 H2.2" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.5"/>
      <path d="M0 1.8 H2.2" stroke="#000000" stroke-opacity="0.09" stroke-width="0.5"/>
    </pattern>

    <filter id="opsSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="opsSoftS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>

    <clipPath id="opsFrontClip">
      <rect x="62" y="102" width="180" height="48" rx="4"/>
    </clipPath>
  </defs>

  <ellipse cx="162" cy="158" rx="106" ry="10" fill="#04070c" opacity="0.45" filter="url(#opsSoft)"/>

  <!-- Top plane -->
  <path d="M62 102 L242 102 L254 88 L74 88 Z" fill="url(#opsTop)"/>
  <path d="M62 102 L242 102 L254 88 L74 88 Z" fill="url(#opsBrush)"/>
  <path d="M74 88 L254 88 L254 89.6 L74 89.6 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Vent slots on the top plane -->
  <g stroke="#2c333a" stroke-width="1.5" opacity="0.55">
    <path d="M96 92.5 L236 92.5"/>
    <path d="M98 95.5 L234 95.5"/>
    <path d="M100 98.5 L232 98.5"/>
  </g>
  <g stroke="#ffffff" stroke-width="0.6" opacity="0.18">
    <path d="M96 94 L236 94"/>
    <path d="M98 97 L234 97"/>
  </g>

  <!-- Right cheek -->
  <path d="M242 102 L254 88 L254 134 L242 150 Z" fill="url(#opsSide)"/>
  <path d="M242 102 L254 88 L254 89.6 L242 103.6 Z" fill="#ffffff" opacity="0.2"/>

  <!-- Front face -->
  <g clip-path="url(#opsFrontClip)">
    <rect x="62" y="102" width="180" height="48" fill="url(#opsFront)"/>
    <rect x="62" y="102" width="180" height="48" fill="url(#opsBrush)" opacity="0.6"/>

    <!-- brushed sheen -->
    <rect x="62" y="102" width="180" height="7" fill="#ffffff" opacity="0.10"/>
    <rect x="62" y="144" width="180" height="6" fill="#000000" opacity="0.35"/>

    <!-- ports -->
    <g>
      <!-- power button -->
      <circle cx="76" cy="126" r="4.2" fill="#0b0f13"/>
      <circle cx="76" cy="126" r="4.2" fill="none" stroke="#78828c" stroke-opacity="0.6"/>
      <circle cx="76" cy="126" r="1.6" fill="#34d399" opacity="0.9"/>
      <circle cx="76" cy="126" r="3.4" fill="#34d399" opacity="0.22" filter="url(#opsSoftS)"/>

      <!-- USB-A x2 -->
      <rect x="90" y="121" width="14" height="10" rx="1.4" fill="url(#opsPort)"/>
      <rect x="93" y="124" width="8" height="4" rx="1" fill="#2f6fbf" opacity="0.85"/>
      <rect x="108" y="121" width="14" height="10" rx="1.4" fill="url(#opsPort)"/>
      <rect x="111" y="124" width="8" height="4" rx="1" fill="#2f6fbf" opacity="0.85"/>

      <!-- HDMI -->
      <path d="M128 121 h18 l2 3 v5 l-2 3 h-18 l-2-3 v-5 Z" fill="url(#opsPort)"/>
      <rect x="130" y="124" width="14" height="4" rx="0.8" fill="#3a444e"/>

      <!-- RJ45 -->
      <rect x="154" y="119" width="18" height="13" rx="1.6" fill="url(#opsPort)"/>
      <rect x="157" y="122" width="12" height="7" rx="0.8" fill="#20262c"/>
      <path d="M159 122 v7M162 122 v7M165 122 v7" stroke="#5b666f" stroke-width="0.7" opacity="0.7"/>

      <!-- audio jack -->
      <circle cx="182" cy="126" r="4" fill="url(#opsPort)"/>
      <circle cx="182" cy="126" r="1.8" fill="#05080b"/>

      <!-- status LEDs -->
      <circle cx="196" cy="126" r="1.4" fill="#22d3ee" opacity="0.9"/>
      <circle cx="202" cy="126" r="1.4" fill="#34d399" opacity="0.6"/>

      <!-- model label -->
      <text x="212" y="129" font-family="Arial, Helvetica, sans-serif" font-size="5.6" font-weight="700"
        letter-spacing="0.8" fill="#aab4be" opacity="0.75">OPS i7</text>
    </g>

    <rect x="62" y="102" width="180" height="48" fill="none" stroke="#000000" stroke-opacity="0.55"/>
    <rect x="62" y="102" width="180" height="1.4" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- Bottom edge shadow -->
  <path d="M62 150 L242 150 L254 134 L254 136.5 L242 152.5 L62 152.5 Z" fill="#000000" opacity="0.5"/>
</svg>
