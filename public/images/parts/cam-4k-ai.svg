<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Millennium 4K AI auto-framing conference camera">
  <defs>
    <!-- Light comes from the upper left throughout: the roof plane is the
         brightest surface, the front face is mid, the right cheek is darkest.
         That three-tone relationship is what makes a box read as a box. -->
    <linearGradient id="camRoof" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4650"/>
      <stop offset="0.45" stop-color="#5b636e"/>
      <stop offset="1" stop-color="#333941"/>
    </linearGradient>
    <linearGradient id="camFront" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#343b44"/>
      <stop offset="0.14" stop-color="#20262d"/>
      <stop offset="0.55" stop-color="#14181d"/>
      <stop offset="0.88" stop-color="#0b0e12"/>
      <stop offset="1" stop-color="#191e24"/>
    </linearGradient>
    <linearGradient id="camSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15191e"/>
      <stop offset="1" stop-color="#06080a"/>
    </linearGradient>
    <linearGradient id="camRing" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9aa4af"/>
      <stop offset="0.28" stop-color="#5a636d"/>
      <stop offset="0.62" stop-color="#2c333b"/>
      <stop offset="1" stop-color="#767f8a"/>
    </linearGradient>
    <radialGradient id="camGlass" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#3f6f9c"/>
      <stop offset="0.28" stop-color="#16283c"/>
      <stop offset="0.62" stop-color="#070c12"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="camGrille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.5" stop-color="#1c222a"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>

    <pattern id="camMesh" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.72" fill="#000000" opacity="0.85"/>
      <circle cx="1.1" cy="1.1" r="0.3" fill="#4a5560" opacity="0.55"/>
    </pattern>

    <filter id="camSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="camSoftS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <clipPath id="camFrontClip">
      <rect x="58" y="84" width="192" height="54" rx="9"/>
    </clipPath>
  </defs>

  <!-- Contact shadow -->
  <ellipse cx="160" cy="150" rx="104" ry="9" fill="#050a14" opacity="0.42" filter="url(#camSoft)"/>

  <!-- Roof plane -->
  <path d="M58 84 L250 84 L262 72 L70 72 Z" fill="url(#camRoof)"/>
  <path d="M70 72 L262 72 L262 73.4 L70 73.4 Z" fill="#ffffff" opacity="0.22"/>
  <!-- soft sheen across the roof -->
  <path d="M86 82 L128 74 L196 74 L166 82 Z" fill="#ffffff" opacity="0.10" filter="url(#camSoftS)"/>

  <!-- Right cheek -->
  <path d="M250 84 L262 72 L262 126 L250 138 Z" fill="url(#camSide)"/>
  <path d="M250 84 L262 72 L262 73.6 L250 85.6 Z" fill="#ffffff" opacity="0.16"/>

  <!-- Front face -->
  <g clip-path="url(#camFrontClip)">
    <rect x="58" y="84" width="192" height="54" fill="url(#camFront)"/>

    <!-- speaker grilles -->
    <rect x="68" y="94" width="46" height="34" rx="5" fill="url(#camGrille)"/>
    <rect x="68" y="94" width="46" height="34" rx="5" fill="url(#camMesh)"/>
    <rect x="68" y="94" width="46" height="34" rx="5" fill="none" stroke="#000000" stroke-opacity="0.7"/>
    <rect x="68.6" y="94.6" width="44.8" height="32.8" rx="4.4" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

    <rect x="194" y="94" width="46" height="34" rx="5" fill="url(#camGrille)"/>
    <rect x="194" y="94" width="46" height="34" rx="5" fill="url(#camMesh)"/>
    <rect x="194" y="94" width="46" height="34" rx="5" fill="none" stroke="#000000" stroke-opacity="0.7"/>
    <rect x="194.6" y="94.6" width="44.8" height="32.8" rx="4.4" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

    <!-- top edge highlight, bottom edge shadow -->
    <rect x="58" y="84" width="192" height="1.4" fill="#ffffff" opacity="0.20"/>
    <rect x="58" y="136.6" width="192" height="1.4" fill="#000000" opacity="0.55"/>
    <!-- left cheek highlight -->
    <rect x="58" y="84" width="1.6" height="54" fill="#ffffff" opacity="0.13"/>
  </g>

  <!-- Lens assembly -->
  <g>
    <!-- housing shadow on the front face -->
    <ellipse cx="154" cy="115" rx="27" ry="25" fill="#000000" opacity="0.5" filter="url(#camSoftS)"/>
    <circle cx="154" cy="111" r="23.5" fill="url(#camRing)"/>
    <circle cx="154" cy="111" r="23.5" fill="none" stroke="#000000" stroke-opacity="0.5"/>
    <circle cx="154" cy="111" r="21.6" fill="#0a0d11"/>
    <circle cx="154" cy="111" r="20.4" fill="url(#camGlass)"/>
    <!-- aperture + inner reflections -->
    <circle cx="154" cy="111" r="11" fill="#04070b"/>
    <circle cx="154" cy="111" r="11" fill="none" stroke="#3b6f9e" stroke-opacity="0.45" stroke-width="0.9"/>
    <circle cx="154" cy="111" r="5.6" fill="#000000"/>
    <ellipse cx="149" cy="105" rx="6.4" ry="4.2" fill="#9fd8ff" opacity="0.30" filter="url(#camSoftS)"/>
    <ellipse cx="147.4" cy="103.4" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.55"/>
    <!-- ring specular -->
    <path d="M136 99 A 22 22 0 0 1 160 89.6" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M174 122 A 22 22 0 0 1 150 132" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Status LED -->
  <circle cx="236" cy="130" r="1.6" fill="#34d399"/>
  <circle cx="236" cy="130" r="4" fill="#34d399" opacity="0.28" filter="url(#camSoftS)"/>
</svg>
