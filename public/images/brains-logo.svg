<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Neural Network Design -->
  <defs>
    <linearGradient id="brainsPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E91E8C"/>
      <stop offset="100%" stop-color="#D946A6"/>
    </linearGradient>
    <linearGradient id="brainsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="brainsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Network Connections -->
  <line x1="60" y1="40" x2="80" y2="30" stroke="url(#brainsPurple)" stroke-width="2" opacity="0.6"/>
  <line x1="80" y1="30" x2="100" y2="35" stroke="url(#brainsCyan)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="35" x2="110" y2="55" stroke="url(#brainsCyan)" stroke-width="2" opacity="0.6"/>
  <line x1="60" y1="40" x2="75" y2="65" stroke="url(#brainsPink)" stroke-width="2" opacity="0.6"/>
  <line x1="75" y1="65" x2="95" y2="70" stroke="url(#brainsPurple)" stroke-width="2" opacity="0.6"/>
  <line x1="95" y1="70" x2="110" y2="55" stroke="url(#brainsCyan)" stroke-width="2" opacity="0.6"/>
  <line x1="80" y1="30" x2="95" y2="70" stroke="url(#brainsPurple)" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Neural Nodes (Circles) -->
  <circle cx="60" cy="40" r="12" fill="url(#brainsPink)" filter="url(#glow)"/>
  <circle cx="80" cy="30" r="14" fill="url(#brainsPurple)" filter="url(#glow)"/>
  <circle cx="100" cy="35" r="11" fill="url(#brainsCyan)" filter="url(#glow)"/>
  <circle cx="110" cy="55" r="13" fill="url(#brainsCyan)" filter="url(#glow)"/>
  <circle cx="75" cy="65" r="10" fill="url(#brainsPink)" filter="url(#glow)"/>
  <circle cx="95" cy="70" r="11" fill="url(#brainsPurple)" filter="url(#glow)"/>
  
  <!-- Small white core nodes -->
  <circle cx="80" cy="30" r="4" fill="white" opacity="0.9"/>
  <circle cx="110" cy="55" r="3" fill="white" opacity="0.9"/>
  <circle cx="95" cy="70" r="3" fill="white" opacity="0.9"/>

  <!-- BRAINS Text -->
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="1">
    <tspan fill="url(#brainsPink)">BR</tspan>
    <tspan fill="url(#brainsPurple)">AI</tspan>
    <tspan fill="url(#brainsCyan)">NS</tspan>
  </text>

  <!-- INFINITE INNOVATIONS Text -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="2" fill="#64748B">
    INFINITE INNOVATIONS
  </text>
</svg>
