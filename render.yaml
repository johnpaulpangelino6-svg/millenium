# Render.com Configuration
# Connected to External Cloud Database for multi-host persistence and instant sync

services:
  - type: web
    name: millenium
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Signs the API auth tokens issued at login.
      # REQUIRED in production: set a long random value (32+ chars) in the Render
      # dashboard. Without it the server generates a random secret at startup and
      # every deploy signs all users out.
      - key: AUTH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Outbound mail for the password-reset flow.
      # REQUIRED for "forgot password" to work on the deployed site: without a
      # transport, NODE_ENV=production refuses to expose the reset code and the
      # user is told to check an inbox that will never receive anything.
      #
      # Auto-detected; first fully-configured option wins:
      #     BREVO_API_KEY  ->  RESEND_API_KEY  ->  SMTP_*
      #
      # Easiest is Brevo: an API key needs no App Password and no 2-Step
      # Verification. Verify a sender address, then paste the key here.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Gmail SMTP alternative. SMTP_PASS must be a 16-character App Password
      # (2-Step Verification required) — a normal Gmail password will NOT work.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

# Database Notes:
# By setting DATABASE_URL and DATABASE_AUTH_TOKEN in Render's Environment Variables,
# both your local development server and your Render website will read and write
# to the exact same external cloud database in real time.
