# Render.com Configuration
# Connected to External Cloud Database for multi-host persistence and instant sync

services:
  - type: web
    name: millenium
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Signs the API auth tokens issued at login.
      # REQUIRED in production: set a long random value (32+ chars) in the Render
      # dashboard. Without it the server generates a random secret at startup and
      # every deploy signs all users out.
      - key: AUTH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false

# Database Notes:
# By setting DATABASE_URL and DATABASE_AUTH_TOKEN in Render's Environment Variables,
# both your local development server and your Render website will read and write
# to the exact same external cloud database in real time.
