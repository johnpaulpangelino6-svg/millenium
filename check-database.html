<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Status Checker - Millennium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .status-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        
        .status-box.success {
            border-left-color: #28a745;
            background: #d4edda;
        }
        
        .status-box.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        
        .status-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .status-value {
            font-family: 'Courier New', monospace;
            color: #666;
            font-size: 14px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .users-table th,
        .users-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .users-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        
        .users-table tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-admin {
            background: #667eea;
            color: white;
        }
        
        .badge-technician {
            background: #28a745;
            color: white;
        }
        
        .badge-customer {
            background: #ffc107;
            color: #333;
        }
        
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
        
        .back-btn {
            background: #6c757d;
            margin-right: 10px;
        }
        
        .back-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ Database Status Checker</h1>
        <p class="subtitle">Millennium SmartBoard Management System</p>
        
        <div id="status">
            <div class="loading">⏳ Loading database status...</div>
        </div>
        
        <div style="margin-top: 30px;">
            <button class="btn back-btn" onclick="window.location.href='/'">← Back to Dashboard</button>
            <button class="btn" onclick="checkDatabase()">🔄 Refresh</button>
        </div>
    </div>
    
    <script>
        async function checkDatabase() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="loading">⏳ Checking database...</div>';
            
            try {
                // Check health endpoint
                const healthRes = await fetch('/health');
                const health = await healthRes.json();
                
                // Get all users
                const usersRes = await fetch('/api/auth/users');
                const usersData = await usersRes.json();
                
                if (!usersData.success) {
                    throw new Error('Failed to fetch users');
                }
                
                const users = usersData.data || [];
                
                // Count by role
                const adminCount = users.filter(u => u.role === 'admin').length;
                const techCount = users.filter(u => u.role === 'technician').length;
                const customerCount = users.filter(u => u.role === 'customer').length;
                
                // Build status HTML
                let html = `
                    <div class="status-box success">
                        <div class="status-label">✅ Database Status</div>
                        <div class="status-value">Connected and operational</div>
                    </div>
                    
                    <div class="status-box">
                        <div class="status-label">📊 Database Engine</div>
                        <div class="status-value">${health.database || 'SQLite'}</div>
                    </div>
                    
                    <div class="status-box">
                        <div class="status-label">👥 Total Users</div>
                        <div class="status-value">
                            ${users.length} users registered
                            <br>
                            ${adminCount} admin(s) • ${techCount} technician(s) • ${customerCount} customer(s)
                        </div>
                    </div>
                    
                    <div class="status-box">
                        <div class="status-label">👤 Registered Users</div>
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Role</th>
                                    <th>Organization</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                users.forEach(user => {
                    const badgeClass = `badge-${user.role}`;
                    html += `
                        <tr>
                            <td><strong>${user.username}</strong></td>
                            <td>${user.fullName}</td>
                            <td><span class="badge ${badgeClass}">${user.role.toUpperCase()}</span></td>
                            <td>${user.organization || 'N/A'}</td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="status-box">
                        <div class="status-label">🔐 Admin Login</div>
                        <div class="status-value">
                            Username: <strong>admin</strong><br>
                            Password: <strong>Admin@2026!</strong>
                        </div>
                    </div>
                `;
                
                statusDiv.innerHTML = html;
                
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status-box error">
                        <div class="status-label">❌ Database Error</div>
                        <div class="status-value">
                            ${error.message}
                            <br><br>
                            Please make sure the server is running and the database is initialized.
                            <br>
                            Run: <strong>npm run db:seed</strong>
                        </div>
                    </div>
                `;
            }
        }
        
        // Auto-load on page load
        checkDatabase();
    </script>
</body>
</html>
